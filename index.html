<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中文人聲節拍器</title>
<style>
  :root{
    --bg:#14161c; --panel:#1d212b; --line:#2b3140;
    --ink:#eef1f6; --dim:#8d96a8;
    --hot:#ffb000; --cool:#4aa8ff; --ok:#3ddc97; --bad:#e2574c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
    display:flex; justify-content:center; padding:20px 16px 48px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%; max-width:480px}
  h1{font-size:20px; margin:4px 0 2px; letter-spacing:1px}
  .sub{color:var(--dim); font-size:13px; margin:0 0 20px}

  .beats{display:flex; gap:8px; justify-content:center; margin:0 0 18px; min-height:56px; align-items:center}
  .dot{
    flex:1; max-width:52px; aspect-ratio:1; border-radius:50%;
    border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:17px; color:var(--dim);
    transition:transform .06s, background .18s, color .18s, border-color .18s;
  }
  .dot.on{background:var(--cool); border-color:var(--cool); color:#0d1017; transform:scale(1.14)}
  .dot.on.acc{background:var(--hot); border-color:var(--hot)}

  .bpm{text-align:center; margin-bottom:6px}
  .bpm b{font-size:64px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
  .bpm span{color:var(--dim); font-size:14px; margin-left:6px}
  input[type=range]{width:100%; accent-color:var(--cool); height:28px}

  .row{display:flex; gap:8px; margin:10px 0}
  button{
    font:inherit; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:11px 10px;
    cursor:pointer; flex:1; transition:background .15s,border-color .15s;
  }
  button:hover{background:#252a36}
  button.sel{background:var(--cool); border-color:var(--cool); color:#0d1017; font-weight:600}
  button:disabled{opacity:.35; cursor:not-allowed}

  #play{
    width:100%; padding:18px; font-size:19px; font-weight:600; margin:16px 0 4px;
    background:var(--ok); border-color:var(--ok); color:#0b1410;
  }
  #play.running{background:var(--bad); border-color:var(--bad); color:#fff}

  .block{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0}
  .lbl{font-size:13px; color:var(--dim); display:flex; justify-content:space-between; margin-bottom:7px}
  .lbl i{font-style:normal; color:var(--ink); font-variant-numeric:tabular-nums}
  select{
    width:100%; font:inherit; color:var(--ink); background:#14171f;
    border:1px solid var(--line); border-radius:8px; padding:9px;
  }
  .hint{font-size:12px; color:var(--dim); line-height:1.65; margin-top:8px}
  .hint code{background:#14171f; border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:11px}
  .warn{color:var(--hot)}

  /* 節奏型按鈕：樂譜圖標 + 名稱 */
  #subRow{gap:5px}
  #subRow button{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 1px; font-size:11.5px; line-height:1.2; white-space:nowrap;
  }
  .nt{width:100%; max-width:44px; height:26px; display:block; fill:currentColor}
  .nn{font-size:9px; font-weight:700; text-anchor:middle; fill:currentColor}

  .kbd{font-size:12px; color:var(--dim); text-align:center; margin-top:18px}
  .kbd b{color:var(--ink); background:#14171f; border:1px solid var(--line); border-radius:4px; padding:1px 6px}
</style>
</head>
<body>
<div class="wrap">

  <h1>中文人聲節拍器</h1>
  <p class="sub">木魚 ×「一二三四五六七八」</p>

  <div class="beats" id="beats"></div>

  <div class="bpm"><b id="bpmNum">90</b><span>BPM</span></div>
  <input type="range" id="bpm" min="30" max="240" value="90" step="1">

  <div class="row">
    <button id="tap">點這裡抓速度</button>
    <button id="m1">−1</button>
    <button id="p1">+1</button>
  </div>

  <button id="play">開始</button>

  <div class="block">
    <div class="lbl">一小節幾拍</div>
    <div class="row" id="barRow"></div>
    <div class="lbl" style="margin-top:12px">每拍再分幾下</div>
    <div class="row" id="subRow">
      <button data-sub="none" class="sel" title="不分：一拍一下">
        <svg class="nt" viewBox="0 0 48 30" aria-hidden="true">
          <ellipse cx="21" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 21 22)"/>
          <rect x="24.7" y="8" width="1.7" height="14.3"/>
        </svg>
        <span>不分</span>
      </button>

      <button data-sub="trip" title="三連音：一拍切三等份 1:1:1">
        <svg class="nt" viewBox="0 0 48 30" aria-hidden="true">
          <ellipse cx="10" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 10 22)"/>
          <ellipse cx="22" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 22 22)"/>
          <ellipse cx="34" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 34 22)"/>
          <rect x="13.7" y="9" width="1.7" height="13.3"/>
          <rect x="25.7" y="9" width="1.7" height="13.3"/>
          <rect x="37.7" y="9" width="1.7" height="13.3"/>
          <rect x="13.7" y="9" width="25.7" height="2.6"/>
          <text x="26" y="6" class="nn">3</text>
        </svg>
        <span>三連音</span>
      </button>

      <button data-sub="swing" title="長短拍：長 2 短 1（三連音的第一下和第三下）">
        <svg class="nt" viewBox="0 0 48 30" aria-hidden="true">
          <ellipse cx="13" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 13 22)"/>
          <rect x="16.7" y="9" width="1.7" height="13.3"/>
          <ellipse cx="31" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 31 22)"/>
          <rect x="34.7" y="9" width="1.7" height="13.3"/>
          <path d="M36.4 9.4 C 41 10.6, 42 13.6, 39 17 C 40.4 13.4, 38.6 11.8, 36.4 12.6 Z"/>
          <text x="24" y="6" class="nn">3</text>
        </svg>
        <span>長短拍</span>
      </button>

      <button data-sub="dot" title="附點：前長後短 3:1（附點八分 + 十六分）">
        <svg class="nt" viewBox="0 0 48 30" aria-hidden="true">
          <ellipse cx="11" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 11 22)"/>
          <circle cx="20.8" cy="21.4" r="1.9"/>
          <rect x="14.7" y="8" width="1.7" height="14.3"/>
          <ellipse cx="33" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 33 22)"/>
          <rect x="36.7" y="8" width="1.7" height="14.3"/>
          <rect x="14.7" y="8" width="23.7" height="2.6"/>
          <rect x="30.4" y="12.2" width="8" height="2.6"/>
        </svg>
        <span>附點</span>
      </button>

      <button data-sub="rdot" title="反附點：前短後長 1:3（十六分 + 附點八分）">
        <svg class="nt" viewBox="0 0 48 30" aria-hidden="true">
          <ellipse cx="10" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 10 22)"/>
          <rect x="13.7" y="8" width="1.7" height="14.3"/>
          <ellipse cx="30" cy="22" rx="4.6" ry="3.3" transform="rotate(-20 30 22)"/>
          <rect x="33.7" y="8" width="1.7" height="14.3"/>
          <circle cx="39.6" cy="21.4" r="1.9"/>
          <rect x="13.7" y="8" width="21.7" height="2.6"/>
          <rect x="13.7" y="12.2" width="8" height="2.6"/>
        </svg>
        <span>反附點</span>
      </button>
    </div>
    <div class="hint">長短拍 2:1（搖擺感）、附點 3:1（前長後短）、反附點 1:3（前短後長）。<br>木魚模式中間那幾下是輕點；中文數拍模式改成在一拍之內數。</div>
  </div>

  <div class="block">
    <div class="lbl">聲音</div>
    <div class="row" id="modeRow">
      <button data-mode="wood" class="sel">木魚</button>
      <button data-mode="voice">中文數拍</button>
    </div>
    <div class="hint warn" id="voiceWarn" hidden></div>
    <div class="lbl" style="margin-top:12px">不一樣的那一拍</div>
    <div class="row" id="accRow">
      <button data-acc="last" class="sel">最後一拍</button>
      <button data-acc="first">第一拍</button>
      <button data-acc="none">都一樣</button>
    </div>
  </div>

  <div class="block">
    <div class="lbl">音量 <i id="volNum">70%</i></div>
    <input type="range" id="vol" min="0" max="100" value="70">
  </div>

  <div class="kbd"><b>空白鍵</b> 開始／停止　<b>↑</b><b>↓</b> 調速度</div>
</div>

<script>
(function(){
  'use strict';

  var DIGITS = ['一','二','三','四','五','六','七','八'];

  /* ---------- 狀態 ---------- */
  // 節奏型：一拍之內，每一下落在哪個位置（0 = 正拍，1 = 下一拍）
  // 用位置而不是「切成幾等份」，才表達得出長短拍這種不等分的。
  var PATTERNS = {
    none:   [0],                // 不分
    trip:   [0, 1/3, 2/3],      // 三連音：三等分
    swing:  [0, 2/3],           // 長短拍：長 2 短 1（三連音的第一下和第三下）
    dot:    [0, 3/4],           // 附點：前長後短 3:1（附點八分 + 十六分）
    rdot:   [0, 1/4]            // 反附點：前短後長 1:3（十六分 + 附點八分）
  };
  var bpm = 90, beatsPerBar = 4, pattern = PATTERNS.none, mode = 'wood', accentAt = 'last';
  var vol = 0.7;
  var running = false;

  var ctx = null, masterGain = null, noiseBuf = null;
  var voiceBufs = new Array(8).fill(null);     // 你的音檔，解碼後放這
  var nextNoteTime = 0, beatIndex = 0, subIndex = 0, timerID = null;
  var LOOKAHEAD = 25, SCHEDULE_AHEAD = 0.15;
  var visQueue = [];

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- 音訊基礎 ---------- */
  function initAudio(){
    if(ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = vol;
    masterGain.connect(ctx.destination);

    var len = Math.floor(ctx.sampleRate * 0.2);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
    return ctx;
  }

  // 木魚：木頭共鳴 + 敲擊瞬態。重音那拍壓低、拉長，聽起來像「收」
  function woodBlock(time, accent){
    var freq = accent ? 760 : 1200;
    var dur  = accent ? 0.13 : 0.075;
    var peak = accent ? 1.0  : 0.6;

    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    osc.frequency.exponentialRampToValueAtTime(freq*0.68, time+dur);
    var og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, time);
    og.gain.exponentialRampToValueAtTime(peak, time+0.003);
    og.gain.exponentialRampToValueAtTime(0.0001, time+dur);
    var body = ctx.createBiquadFilter();
    body.type = 'lowpass'; body.frequency.value = 3400;
    osc.connect(og); og.connect(body); body.connect(masterGain);
    osc.start(time); osc.stop(time+dur+0.02);

    var n = ctx.createBufferSource(); n.buffer = noiseBuf;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = accent ? 1900 : 2700;
    bp.Q.value = 1.1;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(peak*0.5, time);
    ng.gain.exponentialRampToValueAtTime(0.0001, time+0.022);
    n.connect(bp); bp.connect(ng); ng.connect(masterGain);
    n.start(time); n.stop(time+0.05);
  }

  // 細分的那幾下：短、高、輕，聽得出是「分」不是「拍」
  function subTick(time){
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2300, time);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.16, time+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time+0.030);
    osc.connect(g); g.connect(masterGain);
    osc.start(time); osc.stop(time+0.04);
  }

  // 你的人聲音檔：排在音訊時鐘上，取樣級精準
  // maxDur：這個字最多能佔多久。音檔 342～410ms，但 120BPM 的三連音
  // 一下只有 167ms —— 不收掉的話三個字會糊成一團。
  function playVoiceBuf(idx, time, accent, gainMul, maxDur){
    var buf = voiceBufs[idx];
    if(!buf) return false;
    var s = ctx.createBufferSource();
    s.buffer = buf;
    var g = ctx.createGain();
    var lvl = (accent ? 1.0 : 0.82) * (gainMul || 1);
    g.gain.setValueAtTime(lvl, time);
    s.connect(g); g.connect(masterGain);

    if(maxDur && buf.duration > maxDur){
      var fade = Math.min(0.030, maxDur * 0.35);
      g.gain.setValueAtTime(lvl, time + maxDur - fade);
      g.gain.linearRampToValueAtTime(0.0001, time + maxDur);
      s.start(time);
      s.stop(time + maxDur + 0.005);
    } else {
      s.start(time);
    }
    return true;
  }

  /* ---------- 載入人聲音檔 ---------- */

  // 自動裁掉頭尾靜音。節拍器最怕的就是檔案開頭那段空白 ——
  // 錄的時候很難剪乾淨，但程式一看波形就知道聲音從哪裡開始。
  function trimSilence(buf){
    var ch = buf.numberOfChannels, n = buf.length;

    // 先找整段的峰值，門檻取峰值的 2%（相對門檻才不會被錄音音量大小影響）
    var peak = 0, c, i, v;
    for(c=0;c<ch;c++){
      var d = buf.getChannelData(c);
      for(i=0;i<n;i++){ v = Math.abs(d[i]); if(v > peak) peak = v; }
    }
    if(peak === 0) return buf;                    // 整段都是靜音，原樣退回
    var thr = peak * 0.02;

    var first = n, last = 0;
    for(c=0;c<ch;c++){
      var dd = buf.getChannelData(c);
      for(i=0;i<n;i++) if(Math.abs(dd[i]) > thr){ if(i < first) first = i; break; }
      for(i=n-1;i>=0;i--) if(Math.abs(dd[i]) > thr){ if(i > last) last = i; break; }
    }
    if(first >= last) return buf;

    // 起音前留 3ms，免得把子音的氣音頭削掉（「四」「七」最明顯）
    var pad = Math.floor(buf.sampleRate * 0.003);
    first = Math.max(0, first - pad);
    last  = Math.min(n - 1, last + pad);

    var out = ctx.createBuffer(ch, last - first + 1, buf.sampleRate);
    for(c=0;c<ch;c++) out.getChannelData(c).set(buf.getChannelData(c).subarray(first, last + 1));
    out._trimmedMs = first / buf.sampleRate * 1000;
    return out;
  }

  // 載入結果：全齊就不吭聲，缺了才講
  function reportVoice(){
    var miss = [];
    for(var i=0;i<8;i++) if(!voiceBufs[i]) miss.push(DIGITS[i]);
    $('voiceWarn').hidden = !miss.length;
    if(miss.length) $('voiceWarn').textContent =
      '少了這幾拍的音檔：' + miss.join('、') + '（放進 voice/ 資料夾，檔名 1～8）';
  }

  // 頁面載入時試著抓 voice/1.* ～ voice/8.*（正式版用）
  // 先只探「1」，找不到就整個放棄，免得在沒放音檔的情況下噴一堆 404
  function autoLoadVoiceFolder(){
    var exts = ['wav','mp3','m4a','ogg'];

    function grab(num, ext){
      return fetch('voice/' + num + '.' + ext)
        .then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
        .then(function(ab){ initAudio(); return ctx.decodeAudioData(ab); })
        .then(function(buf){ voiceBufs[num-1] = trimSilence(buf); });
    }

    function probe(k){
      if(k >= exts.length){ reportVoice(); return; }   // 沒放音檔，安靜收工
      grab(1, exts[k]).then(function(){
        // 第一拍找到了，同副檔名把 2～8 一起抓
        var rest = [];
        for(var n=2;n<=8;n++) rest.push(grab(n, exts[k]).catch(function(){}));
        Promise.all(rest).then(reportVoice);
      }).catch(function(){ probe(k+1); });
    }
    probe(0);
  }

  /* ---------- 排程 ---------- */
  function isAccent(i){
    if(accentAt === 'none') return false;
    return accentAt === 'last' ? (i === beatsPerBar - 1) : (i === 0);
  }

  function scheduleBeat(i, time, slot){
    var accent = isAccent(i);
    if(mode === 'wood') woodBlock(time, accent);
    if(mode === 'voice') playVoiceBuf(i, time, accent, 1, slot);
    visQueue.push({ beat:i, time:time, accent:accent });
  }

  function scheduler(){
    while(nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD){
      var beatDur = 60.0 / bpm;
      var here = pattern[subIndex];
      // 這一下能響多久 = 到下一下之間的距離（長短拍就是靠這裡不等分）
      var next = (subIndex + 1 < pattern.length) ? pattern[subIndex + 1] : 1;
      var slot = (next - here) * beatDur;
      var main = (subIndex === 0);

      if(mode === 'voice' && pattern.length > 1){
        // 有細分時，中文改成「一拍之內數」：一、二、三
        var accent = main && isAccent(beatIndex);
        playVoiceBuf(subIndex, nextNoteTime, accent, main ? 1 : 0.7, slot * 0.95);
        if(main) visQueue.push({ beat:beatIndex, time:nextNoteTime, accent:accent });
      } else if(main){
        scheduleBeat(beatIndex, nextNoteTime, slot * 0.95);
      } else {
        subTick(nextNoteTime);
      }

      nextNoteTime += slot;
      subIndex++;
      if(subIndex >= pattern.length){
        subIndex = 0;
        beatIndex = (beatIndex + 1) % beatsPerBar;
      }
    }
    timerID = setTimeout(scheduler, LOOKAHEAD);
  }

  function start(){
    initAudio();
    if(ctx.state === 'suspended') ctx.resume();
    running = true;
    beatIndex = 0;
    subIndex = 0;
    nextNoteTime = ctx.currentTime + 0.12;
    $('play').textContent = '停止';
    $('play').classList.add('running');
    scheduler();
    requestAnimationFrame(draw);
  }

  function stop(){
    running = false;
    clearTimeout(timerID);
    visQueue = [];
    $('play').textContent = '開始';
    $('play').classList.remove('running');
    var dots = document.querySelectorAll('.dot');
    for(var i=0;i<dots.length;i++) dots[i].className = 'dot';
  }

  /* ---------- 畫面 ---------- */
  function buildDots(){
    var box = $('beats'); box.innerHTML = '';
    for(var i=0;i<beatsPerBar;i++){
      var d = document.createElement('div');
      d.className = 'dot';
      d.textContent = DIGITS[i];
      box.appendChild(d);
    }
  }

  function draw(){
    if(!running) return;
    var now = ctx.currentTime, ev = null;
    // 畫面被節流時（切到背景分頁、手機鎖屏）會一次欠好幾拍，
    // 那就只畫最新的那一拍，不要補animate跑完整串
    while(visQueue.length && visQueue[0].time <= now) ev = visQueue.shift();
    if(ev){
      var dots = document.querySelectorAll('.dot');
      for(var i=0;i<dots.length;i++) dots[i].className = 'dot';
      if(dots[ev.beat]) dots[ev.beat].className = 'dot on' + (ev.accent ? ' acc' : '');
    }
    requestAnimationFrame(draw);
  }

  /* ---------- 控制 ---------- */
  function setBpm(v){
    bpm = Math.min(240, Math.max(30, Math.round(v)));
    $('bpm').value = bpm;
    $('bpmNum').textContent = bpm;
  }
  $('bpm').addEventListener('input', function(e){ setBpm(+e.target.value); });
  $('m1').onclick = function(){ setBpm(bpm-1); };
  $('p1').onclick = function(){ setBpm(bpm+1); };
  $('play').onclick = function(){ running ? stop() : start(); };

  var taps = [];
  $('tap').onclick = function(){
    var now = performance.now();
    taps = taps.filter(function(t){ return now - t < 2500; });
    taps.push(now);
    if(taps.length >= 2){
      var sum = 0;
      for(var i=1;i<taps.length;i++) sum += taps[i]-taps[i-1];
      setBpm(60000 / (sum/(taps.length-1)));
    }
  };

  (function(){
    var row = $('barRow');
    [1,2,3,4,6,8].forEach(function(n){
      var b = document.createElement('button');
      b.textContent = n;
      if(n === 4) b.className = 'sel';
      b.onclick = function(){
        beatsPerBar = n;
        var bs = row.querySelectorAll('button');
        for(var i=0;i<bs.length;i++) bs[i].classList.remove('sel');
        b.classList.add('sel');
        buildDots();
        beatIndex = 0;
      };
      row.appendChild(b);
    });
  })();

  function pickRow(rowId, attr, cb){
    var row = $(rowId), bs = row.querySelectorAll('button');
    for(var i=0;i<bs.length;i++){
      (function(b){
        b.onclick = function(){
          for(var j=0;j<bs.length;j++) bs[j].classList.remove('sel');
          b.classList.add('sel');
          cb(b.getAttribute(attr));
        };
      })(bs[i]);
    }
  }
  pickRow('modeRow','data-mode', function(v){ mode = v; });
  pickRow('accRow','data-acc', function(v){ accentAt = v; });
  pickRow('subRow','data-sub', function(v){ pattern = PATTERNS[v]; subIndex = 0; });

  $('vol').addEventListener('input', function(e){
    vol = e.target.value/100;
    $('volNum').textContent = e.target.value + '%';
    if(masterGain) masterGain.gain.value = vol;
  });

  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); running ? stop() : start(); }
    if(e.code === 'ArrowUp'){ e.preventDefault(); setBpm(bpm+1); }
    if(e.code === 'ArrowDown'){ e.preventDefault(); setBpm(bpm-1); }
  });

  /* ---------- 起手 ---------- */
  buildDots();
  autoLoadVoiceFolder();
})();
</script>
</body>
</html>
